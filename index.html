<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sand v2</title>

    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>

    <div id="container">
      <canvas id="myCanvas"></canvas>
      <div id="UI">
        <h1>Falling Sand Simulation</h1>
        <hr>
        <div id="controls">
          <button onclick="pauseToggle()">Pause</button>
          <button onclick="reset()">Reset</button>
          <p>Cell Size : <span id="cellSize">20</span></p>
          <input type="range" id="cellSizeInput" min="8" max="32" value="20">

        </div>
      </div>
    </div>
    
    <script src="js/cells.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/main.js"></script>
  </body>

</html>
